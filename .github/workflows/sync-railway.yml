name: Sync middleware to Railway repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Debug token presence
        run: |
          if [ -z "${{ secrets.RAILWAY_DEPLOY_TOKEN }}" ]; then
            echo "TOKEN IS EMPTY ❌"
            exit 1
          else
            echo "TOKEN EXISTS ✅"
          fi

      - name: Checkout main repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Push middleware to Railway repo
        run: |
          git config --global user.name "sync-bot"
          git config --global user.email "sync@github.com"

          cd 402.fhe/middleware
          git init
          git add -A
          git commit -m "sync from main repo"
          git remote add railway https://x-access-token:${{ secrets.RAILWAY_DEPLOY_TOKEN }}@github.com/adii-gif/402-fhe.git
          git push railway HEAD:main --force
